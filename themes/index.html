<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alteração de Tema</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            transition: 0.3s;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Tema escuro */
        body.dark {
            background-color: #1e1e1e;
            color: white;
        }

        body.dark button {
            background-color: white;
            color: black;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Minha Página</h1>

        <p>Clique no botão abaixo para alterar o tema.</p>

        <button onclick="alterarTema()">
            Alterar Tema
        </button>
    </div>

    <script>
        function alterarTema() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
